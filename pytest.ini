[pytest]
# asyncio_mode=auto lets `async def test_*` run without a per-test decorator.
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# Silence third-party/pre-existing app DeprecationWarnings (datetime.utcnow, FastAPI
# on_event, Supabase client kwargs) — they're not what these tests are checking and
# they drown the signal. Real warnings from test code still surface via -W if needed.
filterwarnings =
    ignore::DeprecationWarning
