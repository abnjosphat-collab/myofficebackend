# Runs the backend test suite on every push/PR to main. Nothing here deploys
# anything (Render deploys on push to main independently of this workflow) —
# this only answers "did this change break the tests," automatically, instead
# of relying on whoever's working to have run pytest by hand.
#
# No Supabase/Redis credentials are configured here on purpose: app/supabase_client.py
# and app/redis_client.py both degrade to a loud warning + empty/unreachable client
# when their env vars are unset rather than crashing at import time, and the test
# suite is entirely mocked-Supabase (see tests/test_endpoint_auth.py's own comment on
# why it needs neither) — so the suite runs the same in CI as it does locally without
# needing production secrets exposed to every PR.

name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # --cov is report-only for now (term-missing shows exactly which lines aren't
        # hit) — no --cov-fail-under yet. The point right now is making coverage
        # visible, not gating on it; a threshold can follow once there's a real
        # baseline to set it against instead of guessing one.
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Type-check (report-only)
        # Baseline as of 2026-08-26: ~2084 errors — the codebase has never been
        # type-checked before now. continue-on-error means this can never fail the
        # build; it exists to make the error count visible in every run instead of
        # guessed, same rationale as --cov above. Tighten to blocking once the count
        # is small enough to be a realistic bar, not before.
        run: pyright app
        continue-on-error: true
